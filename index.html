<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#26355d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O/L Countdown">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Mahesh's O/L Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#eaf6ff;
    --sky-bottom:#fff8e6;
    --ink:#26355d;
    --ink-soft:#5a6690;
    --yellow:#ffc93c;
    --yellow-deep:#f5a623;
    --coral:#ff6b6b;
    --coral-deep:#e85454;
    --mint:#6bcb77;
    --mint-deep:#4aa757;
    --card:#ffffff;
    --card-line:#e4ecf7;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 100%);
    color:var(--ink);
    font-family:'Quicksand', sans-serif;
    overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 64px;
    position:relative;
  }

  /* ---- floating school doodles ---- */
  .doodle{
    position:absolute;
    opacity:0.55;
    pointer-events:none;
    animation:float 6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); }
    50%{ transform:translateY(-14px) rotate(var(--r,0deg)); }
  }
  .doodle.d1{ top:6%; left:2%; --r:-10deg; animation-delay:0s; width:46px; }
  .doodle.d2{ top:14%; right:0%; --r:12deg; animation-delay:1.2s; width:40px; }
  .doodle.d3{ top:58%; left:-2%; --r:-6deg; animation-delay:2.1s; width:44px; }
  .doodle.d4{ top:72%; right:2%; --r:8deg; animation-delay:0.7s; width:38px; }

  /* ---- top label ---- */
  .kicker{
    text-align:center;
    font-weight:700;
    letter-spacing:0.3px;
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:6px;
  }
  .kicker span{
    background:var(--yellow);
    color:var(--ink);
    padding:3px 12px;
    border-radius:999px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
  }

  h1.title{
    text-align:center;
    font-size:clamp(26px,7vw,38px);
    font-weight:800;
    line-height:1.15;
    margin:8px 0 28px;
    color:var(--ink);
  }
  h1.title em{
    font-style:normal;
    color:var(--coral-deep);
  }

  /* ---- character + speech bubble ---- */
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:8px;
  }

  .bubble{
    position:relative;
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:26px;
    padding:16px 22px;
    max-width:340px;
    text-align:center;
    box-shadow:6px 6px 0 var(--yellow);
    margin-bottom:6px;
    animation:pop 0.5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .bubble p{
    margin:0;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.35;
    color:var(--ink);
  }
  .bubble .num{
    color:var(--coral-deep);
    font-size:22px;
  }
  .bubble::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-16px;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-top:16px solid var(--ink);
  }
  .bubble::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:-12px;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:13px solid var(--card);
    z-index:1;
  }

  @keyframes pop{
    0%{ opacity:0; transform:translateY(10px) scale(0.92); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .mascot{
    width:200px;
    height:auto;
    animation:wave 3.4s ease-in-out infinite;
    transform-origin:70% 85%;
  }

  .voice-btn{
    display:flex;
    align-items:center;
    gap:8px;
    margin:2px 0 0;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:9px 18px 9px 14px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 6px 14px -6px rgba(38,53,93,0.5);
    transition:transform 0.15s ease, background 0.2s ease;
  }
  .voice-btn:hover{ transform:translateY(-1px); }
  .voice-btn:active{ transform:translateY(0); }
  .voice-btn.speaking{ background:var(--coral-deep); }
  .voice-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .voice-btn .bar{
    transform-origin:center;
    animation:none;
  }
  .voice-btn.speaking .bar1{ animation:bar 0.9s ease-in-out infinite; }
  .voice-btn.speaking .bar2{ animation:bar 0.9s ease-in-out infinite 0.15s; }
  .voice-btn.speaking .bar3{ animation:bar 0.9s ease-in-out infinite 0.3s; }
  @keyframes bar{
    0%,100%{ transform:scaleY(0.4); }
    50%{ transform:scaleY(1); }
  }
  @keyframes wave{
    0%,100%{ transform:rotate(0deg); }
    8%{ transform:rotate(-2deg); }
    16%{ transform:rotate(2deg); }
    24%{ transform:rotate(-1deg); }
    32%{ transform:rotate(0deg); }
  }

  /* ---- countdown card ---- */
  .countdown-card{
    background:var(--card);
    border-radius:28px;
    border:1px solid var(--card-line);
    box-shadow:0 14px 30px -14px rgba(38,53,93,0.25);
    padding:26px 20px 22px;
    margin-top:6px;
  }

  .big-number{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(64px,22vw,96px);
    line-height:1;
    color:var(--ink);
    letter-spacing:-1px;
  }
  .big-number .unit{
    display:block;
    font-size:16px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .sub-clock{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:18px;
  }
  .sub-clock .cell{
    background:var(--sky-top);
    border-radius:14px;
    padding:10px 4px;
    width:64px;
    text-align:center;
  }
  .sub-clock .cell .v{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--ink);
  }
  .sub-clock .cell .l{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    margin-top:2px;
  }

  /* ---- exam date pill ---- */
  .pill-row{
    display:flex;
    justify-content:center;
    margin:22px 0 0;
  }
  .pill{
    background:var(--mint);
    color:#0f3d17;
    font-weight:700;
    font-family:'Baloo 2', sans-serif;
    padding:9px 18px;
    border-radius:999px;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* ---- progress ---- */
  .progress-wrap{
    margin-top:26px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .progress-track{
    height:14px;
    background:var(--sky-top);
    border-radius:999px;
    overflow:hidden;
    border:1px solid var(--card-line);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--mint), var(--yellow));
    border-radius:999px;
    transition:width 0.6s ease;
  }

  /* ---- tip card ---- */
  .tip-card{
    margin-top:22px;
    background:#fff9e9;
    border:1px dashed var(--yellow-deep);
    border-radius:20px;
    padding:16px 18px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .tip-card .icon{
    font-size:22px;
    line-height:1;
  }
  .tip-card p{
    margin:0;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    line-height:1.5;
  }
  .tip-card span.label{
    color:var(--coral-deep);
    font-weight:700;
  }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }

  @media (prefers-reduced-motion: reduce){
    .doodle, .mascot, .bubble{ animation:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <svg class="doodle d1" viewBox="0 0 64 64" fill="none"><rect x="10" y="8" width="30" height="40" rx="3" fill="#ff6b6b" opacity="0.85"/><rect x="16" y="16" width="18" height="3" rx="1.5" fill="#fff"/><rect x="16" y="24" width="18" height="3" rx="1.5" fill="#fff"/><rect x="16" y="32" width="12" height="3" rx="1.5" fill="#fff"/></svg>

  <svg class="doodle d2" viewBox="0 0 64 64" fill="none"><path d="M8 50L44 14l6 6L14 56l-9 3 3-9z" fill="#ffc93c"/><path d="M44 14l6 6-4 4-6-6z" fill="#26355d"/></svg>

  <svg class="doodle d3" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="22" fill="#6bcb77" opacity="0.85"/><rect x="30" y="12" width="4" height="10" rx="2" fill="#26355d"/><rect x="30" y="30" width="14" height="3" rx="1.5" fill="#fff"/></svg>

  <svg class="doodle d4" viewBox="0 0 64 64" fill="none"><rect x="8" y="20" width="48" height="30" rx="4" fill="#ffffff" stroke="#26355d" stroke-width="2.5"/><path d="M8 24l24 16 24-16" stroke="#26355d" stroke-width="2.5" fill="none"/></svg>

  <div class="kicker"><span>G.C.E. O/L 2026</span></div>
  <h1 class="title">Every day counts, <em>Mahesh!</em></h1>

  <div class="stage">
    <div class="bubble" id="bubble">
      <p>Mahesh, only <span class="num" id="bubbleDays">--</span> days left!</p>
    </div>

    <!-- Cute boy mascot SVG -->
    <svg class="mascot" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="110" cy="245" rx="60" ry="10" fill="#26355d" opacity="0.08"/>

      <!-- back arm waving -->
      <path d="M158 150 C 190 140, 200 105, 185 85" stroke="#f2b98a" stroke-width="16" stroke-linecap="round" fill="none"/>
      <circle cx="185" cy="85" r="12" fill="#f2b98a"/>

      <!-- body / shirt -->
      <path d="M62 260 L62 175 C62 150 82 138 110 138 C138 138 158 150 158 175 L158 260 Z" fill="#ff6b6b"/>
      <path d="M62 260 L62 178 C62 178 90 195 110 195 C130 195 158 178 158 178 L158 260 Z" fill="#ff8383"/>
      <rect x="96" y="150" width="28" height="18" rx="6" fill="#ffffff"/>

      <!-- front arm -->
      <path d="M66 150 C 45 165 42 195 55 212" stroke="#f2b98a" stroke-width="16" stroke-linecap="round" fill="none"/>
      <circle cx="55" cy="212" r="11" fill="#f2b98a"/>

      <!-- neck -->
      <rect x="98" y="122" width="24" height="22" rx="10" fill="#f2b98a"/>

      <!-- head -->
      <circle cx="110" cy="90" r="52" fill="#f7c89c"/>

      <!-- ears -->
      <circle cx="60" cy="92" r="9" fill="#f7c89c"/>
      <circle cx="160" cy="92" r="9" fill="#f7c89c"/>

      <!-- hair -->
      <path d="M58 78 C52 30 168 30 162 78 C158 55 140 44 110 44 C80 44 62 55 58 78 Z" fill="#3a2a21"/>
      <path d="M62 70 C70 50 90 42 110 42 C130 42 150 50 158 70 C150 62 132 58 110 58 C88 58 70 62 62 70 Z" fill="#4a362a"/>

      <!-- eyebrows -->
      <path d="M84 82 Q92 76 100 81" stroke="#3a2a21" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M120 81 Q128 76 136 82" stroke="#3a2a21" stroke-width="3.5" stroke-linecap="round" fill="none"/>

      <!-- eyes -->
      <circle cx="92" cy="94" r="6.5" fill="#26355d"/>
      <circle cx="128" cy="94" r="6.5" fill="#26355d"/>
      <circle cx="94" cy="91.5" r="2" fill="#fff"/>
      <circle cx="130" cy="91.5" r="2" fill="#fff"/>

      <!-- blush -->
      <ellipse cx="78" cy="108" rx="9" ry="5.5" fill="#ff9e9e" opacity="0.65"/>
      <ellipse cx="142" cy="108" rx="9" ry="5.5" fill="#ff9e9e" opacity="0.65"/>

      <!-- smile -->
      <path d="M96 112 Q110 124 124 112" stroke="#26355d" stroke-width="3.5" stroke-linecap="round" fill="none"/>

      <!-- school badge on shirt -->
      <circle cx="86" cy="185" r="7" fill="#ffc93c" stroke="#26355d" stroke-width="1.5"/>
    </svg>

    <button class="voice-btn" id="voiceBtn" aria-label="Hear Mahesh's message read aloud">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 10v4h4l5 5V5L8 10H4z" fill="#fff"/>
        <rect class="bar bar1" x="15" y="9" width="2" height="6" rx="1" fill="#fff"/>
        <rect class="bar bar2" x="18" y="7" width="2" height="10" rx="1" fill="#fff"/>
        <rect class="bar bar3" x="21" y="5" width="2" height="14" rx="1" fill="#fff"/>
      </svg>
      <span id="voiceBtnLabel">Hear it out loud</span>
    </button>
  </div>

  <div class="countdown-card">
    <div class="big-number">
      <span id="daysLeft">--</span>
      <span class="unit">DAYS TO GO</span>
    </div>

    <div class="sub-clock">
      <div class="cell"><div class="v" id="hh">00</div><div class="l">hrs</div></div>
      <div class="cell"><div class="v" id="mm">00</div><div class="l">min</div></div>
      <div class="cell"><div class="v" id="ss">00</div><div class="l">sec</div></div>
    </div>

    <div class="pill-row">
      <div class="pill">📅 O/L Exam &nbsp;•&nbsp; December 7, 2026</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Study journey</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <div class="tip-card">
    <div class="icon">💡</div>
    <p><span class="label">Today's tip —</span> <span id="tipText">Revise one past paper, one subject at a time. Small steps add up fast!</span></p>
  </div>

  <footer>You've got this, Mahesh. One day closer, every day. 🌟</footer>

</div>

<script>
  // Exam date: December 7 — resolves to the next upcoming Dec 7
  function getExamDate(){
    const now = new Date();
    let year = now.getFullYear();
    let exam = new Date(year, 11, 7, 8, 0, 0); // 8:00 AM exam day
    if (exam < now) {
      exam = new Date(year + 1, 11, 7, 8, 0, 0);
    }
    return exam;
  }

  const examDate = getExamDate();
  // study journey progress assumes a ~180 day runway; clamp 0-100
  const RUNWAY_DAYS = 180;

  const tips = [
    "Revise one past paper, one subject at a time. Small steps add up fast!",
    "Short, focused sessions beat long tired ones. Try 25 minutes on, 5 off.",
    "Sleep well the night before every paper — your brain needs the rest.",
    "Make a quick summary sheet for each subject. Review it daily.",
    "Past papers first, textbooks second. Practice shows you what to study.",
    "Drink water, take breaks, and breathe. You're doing better than you think."
  ];
  document.getElementById('tipText').textContent = tips[Math.floor(Math.random()*tips.length)];

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const now = new Date();
    let diff = examDate - now;
    if (diff < 0) diff = 0;

    const totalSeconds = Math.floor(diff/1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById('daysLeft').textContent = days;
    document.getElementById('bubbleDays').textContent = days;
    document.getElementById('hh').textContent = pad(hours);
    document.getElementById('mm').textContent = pad(minutes);
    document.getElementById('ss').textContent = pad(seconds);

    const pct = Math.min(100, Math.max(0, Math.round(((RUNWAY_DAYS - days) / RUNWAY_DAYS) * 100)));
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
  }

  tick();
  setInterval(tick, 1000);

  // ---- Voice: read the countdown message aloud ----
  const voiceBtn = document.getElementById('voiceBtn');
  const voiceBtnLabel = document.getElementById('voiceBtnLabel');
  const synth = window.speechSynthesis;
  let pickedVoice = null;

  function choosePreferredVoice(){
    if (!synth) return;
    const voices = synth.getVoices();
    if (!voices.length) return;

    const englishVoices = voices.filter(v => /^en/i.test(v.lang));
    const pool = englishVoices.length ? englishVoices : voices;

    // known male-voice names across Chrome/Edge/Safari/Android voice packs
    const maleNamePattern = /male|boy|kid|child|david|daniel|alex|fred|george|james|oliver|ryan|guy|mark|matthew|brian|tom|aaron|arthur|eric|will\b/i;
    const femaleNamePattern = /female|girl|samantha|victoria|zira|susan|karen|moira|tessa|fiona|kate|allison|ava|serena|amy|emma|joanna|salli|nicky/i;

    pickedVoice =
      pool.find(v => maleNamePattern.test(v.name)) ||
      pool.find(v => !femaleNamePattern.test(v.name) && /en-GB|en-IN|en-US/i.test(v.lang)) ||
      pool[0];
  }

  if (synth){
    choosePreferredVoice();
    synth.onvoiceschanged = choosePreferredVoice;
  }

  function speakMessage(){
    if (!synth){
      voiceBtnLabel.textContent = 'Voice not supported';
      return;
    }
    if (synth.speaking){
      synth.cancel();
      voiceBtn.classList.remove('speaking');
      voiceBtnLabel.textContent = 'Hear it out loud';
      return;
    }

    const days = document.getElementById('daysLeft').textContent;
    const message = `Mahesh, only ${days} days left! You've got this — keep going!`;
    const utter = new SpeechSynthesisUtterance(message);
    if (pickedVoice) utter.voice = pickedVoice;
    utter.rate = 1.02;
    utter.pitch = 1.35;

    utter.onstart = () => {
      voiceBtn.classList.add('speaking');
      voiceBtnLabel.textContent = 'Listening...';
    };
    utter.onend = () => {
      voiceBtn.classList.remove('speaking');
      voiceBtnLabel.textContent = 'Hear it out loud';
    };
    utter.onerror = () => {
      voiceBtn.classList.remove('speaking');
      voiceBtnLabel.textContent = 'Hear it out loud';
    };

    synth.speak(utter);
  }

  voiceBtn.addEventListener('click', speakMessage);

  // tapping the speech bubble also reads it aloud
  document.getElementById('bubble').style.cursor = 'pointer';
  document.getElementById('bubble').addEventListener('click', speakMessage);
</script>
</body>
</html>
